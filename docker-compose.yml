services:
  pgdba-store:
    image: postgres:16-alpine
    # LOG_TO_FILE=true -> ./logs/store.log (see example.env)
    command:
      - postgres
      - -c
      - logging_collector=${LOG_TO_FILE:-false}
      - -c
      - log_directory=/logs
      - -c
      - log_filename=store.log
      - -c
      - log_truncate_on_rotation=off
    environment:
      POSTGRES_USER: ${STORE_POSTGRES_USER:-pgdba}
      POSTGRES_PASSWORD: ${STORE_POSTGRES_PASSWORD:-pgdba}
      POSTGRES_DB: ${STORE_POSTGRES_DB:-pgdba_store}
    volumes:
      - pgdba_store_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${LOG_HOST_DIR:-./logs}:/logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORE_POSTGRES_USER:-pgdba} -d ${STORE_POSTGRES_DB:-pgdba_store}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgdba-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      STORE_DATABASE_URL: postgresql://${STORE_POSTGRES_USER:-pgdba}:${STORE_POSTGRES_PASSWORD:-pgdba}@pgdba-store:5432/${STORE_POSTGRES_DB:-pgdba_store}
      SECRET_KEY: ${APP_SECRET_KEY:-dev-only-insecure-key-change-me}
      ALLOW_INSECURE_SECRET_KEY: ${APP_ALLOW_INSECURE_SECRET_KEY:-false}
      AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
      # Optional machine integrations, each off until its token is set.
      MCP_TOKEN: ${APP_MCP_TOKEN:-}
      METRICS_TOKEN: ${APP_METRICS_TOKEN:-}
      PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Feature flags, off unless set to true in .env.
      FEATURE_WORKLOAD_3D: ${APP_FEATURE_WORKLOAD_3D:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${UI_PORT:-5173}}
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      LOG_DIR: /logs
      SCHEDULER_MAX_PARALLEL_TARGETS: ${SCHEDULER_MAX_PARALLEL_TARGETS:-4}
      REFACTOR_PARTITION_MIN_TABLE_MB: ${REFACTOR_PARTITION_MIN_TABLE_MB:-1024}
      STORE_POOL_MAX_SIZE: ${STORE_POOL_MAX_SIZE:-20}
    volumes:
      - ${LOG_HOST_DIR:-./logs}:/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      pgdba-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgdba-ui:
    build: ./ui
    environment:
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
    volumes:
      - ${LOG_HOST_DIR:-./logs}:/logs
    ports:
      - "${UI_PORT:-5173}:80"
    depends_on:
      pgdba-backend:
        condition: service_healthy

  pgdba-demo-target:
    # postgres:16 (Debian) plus HypoPG for the What-if Indexes screen — see
    # demo/Dockerfile. A demo volume created by the earlier Alpine image
    # should be recreated (see README): glibc and musl sort text differently.
    build: ./demo
    image: dbbutler-demo-target:16
    # A local build, never on a registry: don't try to pull it first.
    pull_policy: build
    profiles: ["demo"]
    # pg_stat_statements must be preloaded before the server starts so the
    # seed script's `CREATE EXTENSION` (and everything Query Intelligence /
    # Schema Lint depend on) actually works. max_prepared_transactions lets
    # the seed leave one forgotten prepared transaction behind (the Vacuum
    # Horizon demo — see demo/seed.sql).
    # LOG_TO_FILE=true -> ./logs/demo-target.log (see example.env)
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_prepared_transactions=5
      - -c
      - logging_collector=${LOG_TO_FILE:-false}
      - -c
      - log_directory=/logs
      - -c
      - log_filename=demo-target.log
      - -c
      - log_truncate_on_rotation=off
    environment:
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-demo}
    ports:
      - "${DEMO_PORT:-5433}:5432"
    volumes:
      - pgdba_demo_data:/var/lib/postgresql/data
      - ./demo/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ${LOG_HOST_DIR:-./logs}:/logs

volumes:
  pgdba_store_data:
  pgdba_demo_data:
