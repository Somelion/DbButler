name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: pip-audit
        run: pip-audit --require-hashes --disable-pip -r requirements.txt

  ui:
    name: UI — lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=moderate

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, ui]
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t dbbutler-backend:ci .
      - name: Backend image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id dbbutler-backend:ci -u)" != "0"
      - name: Build UI image
        run: docker build -t dbbutler-ui:ci ui
