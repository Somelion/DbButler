<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DbButler</title>
    <script>
      // Apply a pinned light/dark theme before first paint (see src/theme.jsx).
      try {
        var theme = localStorage.getItem("pgdba.theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
