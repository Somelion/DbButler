server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend routes are all under /api — see backend/app/main.py. Proxied
    # server-side so the browser only ever talks to this one origin, and
    # never needs to know the backend's real host/port. This is already
    # host-agnostic (proxy_pass uses the Docker service name, not
    # "localhost"), so it behaves the same whether the browser reached this
    # container via localhost or a LAN IP — a 502 here means nginx itself
    # couldn't get a good response from pgdba-backend, not a client-side
    # host/origin mismatch.
    #
    # resolver + a variable-based proxy_pass forces Docker's embedded DNS
    # (127.0.0.11) to be re-checked periodically instead of nginx caching
    # whatever IP pgdba-backend had at container start — otherwise a backend
    # restart (new container, new IP) can leave nginx proxying to a stale,
    # now-dead address until nginx itself is reloaded. proxy_http_version
    # 1.1 + clearing Connection enables keep-alive to the upstream, which
    # some Docker network paths carry more reliably than the default
    # HTTP/1.0-style per-request connection.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend "pgdba-backend:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA — unmatched paths fall back to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
