server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend routes are all under /api — see backend/app/main.py. Proxied
    # server-side so the browser only ever talks to this one origin, and
    # never needs to know the backend's real host/port.
    location /api/ {
        proxy_pass http://pgdba-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — unmatched paths fall back to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
